{% extends 'base.html' %}

{% block titulo %}Marcas{% endblock %}

{% block contenido %}
<div class="container mt-4">
    <h3>Listar Marcas</h3>

    <div class="card">
      <div class="card-header">
        <button type="button" class="btn btn-primary" id="btnAgregar">Agregar</button>
      </div>
      <div class="card-body">
        <table class="table table-striped" id="tbl">
          <thead>
            <tr>
              <th>ID</th>
              <th>Descripción</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="modal" id="modalFormulario">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

          <div class="modal-header">
            <h4 class="modal-title" id="modalTitle"></h4>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>

          <div class="modal-body">
            <div class="form-group">
              <input type="hidden" id="txtIdMarca">
              <label for="txtDescripcion">Descripción:</label>
              <input type="text" class="form-control" placeholder="Ingrese alguna marca" id="txtDescripcion">
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
            <button type="button" class="btn btn-danger" data-dismiss="modal">Cerrar</button>
          </div>

        </div>
      </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
const initDatatable = () => {
  $('#tbl').DataTable({
    language: { url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}" },
    ajax:'/api/v1/marcas',
    columns: [
      { data: 'id' },
      { data: 'descripcion' },
      { data: row => `
        <button type="button" name="btn_editar" class="btn btn-primary" data-id="${row.id}">Editar</button>
        <button type="button" name="btn_eliminar" class="btn btn-danger" data-id="${row.id}">Eliminar</button>` }
    ]
  });
};

const validarFormulario = () => {
  const descripcion = $('#txtDescripcion').val().trim();
  if (!descripcion) {
    Swal.fire("Error", "La descripción es obligatoria.", "error");
    return false;
  }

  // Solo letras, espacios y guiones
  const regex = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s\-]+$/;
  if (!regex.test(descripcion)) {
    Swal.fire("Error", "La descripción solo puede contener letras, espacios o guiones.", "error");
    return false;
  }

  return true;
};

const agregar = () => {
  $('#btnAgregar').on('click', () => {
    $('#modalTitle').text("Agregar una Marca");
    $('#txtIdMarca').val("");
    $('#txtDescripcion').val("");
    $('#modalFormulario').modal();
  });
};

const guardar = () => {
  $('#btnGuardar').on('click', () => {
    if (!validarFormulario()) return;

    const idMarca = $('#txtIdMarca').val();
    const descripcion = $('#txtDescripcion').val().trim();
    const tabla = $('#tbl').DataTable();
    const url = idMarca ? `/api/v1/marcas/${idMarca}` : `/api/v1/marcas`;
    const method = idMarca ? 'PUT' : 'POST';

    fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ descripcion })
    })
    .then(resp => resp.json())
    .then(data => {
      if(data && data.success) {
        tabla.ajax.reload();
        Swal.fire(idMarca ? "Actualizado" : "Agregado", `Marca ${idMarca ? 'actualizada' : 'agregada'} correctamente.`, "success");
        $('#modalFormulario').modal("hide");
      } else {
        Swal.fire("Error", data.error || "Ocurrió un error desconocido", "error");
      }
    })
    .catch(() => Swal.fire("Error", "Ocurrió un error de comunicación con el servidor.", "error"));
  });
};

const editar = () => {
  $('#tbl').on('click', 'button[name="btn_editar"]', function() {
    const idMarca = $(this).data('id');
    fetch(`/api/v1/marcas/${idMarca}`)
      .then(resp => resp.json())
      .then(data => {
        if(data.success && data.data) {
          $('#txtIdMarca').val(idMarca);
          $('#txtDescripcion').val(data.data.descripcion);
          $('#modalTitle').text("Editar una Marca");
          $('#modalFormulario').modal();
        } else {
          Swal.fire("Error", "No se pudo cargar la marca.", "error");
        }
      });
  });
};

const eliminar = () => {
  $('#tbl').on('click', 'button[name="btn_eliminar"]', function() {
    const idMarca = $(this).data('id');
    Swal.fire({
      title: "¿Deseas eliminar este registro?",
      showCancelButton: true,
      confirmButtonText: "Sí",
      cancelButtonText: "No"
    }).then(result => {
      if(result.isConfirmed) {
        fetch(`/api/v1/marcas/${idMarca}`, { method: 'DELETE' })
          .then(resp => resp.json())
          .then(data => {
            if(data && data.success) {
              $('#tbl').DataTable().ajax.reload();
              Swal.fire("Eliminado", "Marca eliminada correctamente.", "success");
            } else {
              Swal.fire("Error", data.error || "Error desconocido");
            }
          }).catch(() => Swal.fire("Error", "Ocurrió un error al eliminar la marca.", "error"));
      }
    });
  });
};

$(document).ready(() => {
  initDatatable();
  agregar();
  guardar();
  editar();
  eliminar();
});
</script>
{% endblock %}
