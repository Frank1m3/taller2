{% extends 'base.html' %}

{% block titulo %}Depósitos{% endblock %}

{% block contenido %}
<div class="container mt-4">
    <h3>Listar Depósitos</h3>

    <div class="card">
      <div class="card-header">
        <button type="button" class="btn btn-primary" id="btnAgregar">Agregar</button>
      </div>
      <div class="card-body">
        <table class="table table-striped" id="tbl">
          <thead>
            <tr>
              <th>ID</th>
              <th>Descripción</th>
              <th>Sucursal</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Modal Form -->
    <div class="modal" id="modalFormulario" tabindex="-1" role="dialog" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">

          <div class="modal-header">
            <h4 class="modal-title" id="modalTitle"></h4>
            <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">&times;</button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="txtIdDeposito">

            <div class="form-group">
              <label for="txtDescripcion">Descripción:</label>
              <input type="text" class="form-control" placeholder="Ingrese descripción" id="txtDescripcion" autocomplete="off">
            </div>

            <div class="form-group">
              <label for="selectSucursal">Sucursal:</label>
              <select class="form-control" id="selectSucursal">
                <option value="">Seleccione una sucursal</option>
              </select>
            </div>

          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
            <button type="button" class="btn btn-danger" data-dismiss="modal">Cerrar</button>
          </div>

        </div>
      </div>
    </div>

</div>
{% endblock %}

{% block js %}
<script>
const initDatatable = () => {
  $('#tbl').DataTable({
    language: { url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}" },
    ajax: '/api/v1/depositos',
    columns: [
      { data: 'id_deposito' },
      { data: 'descripcion', defaultContent: '' },
      { data: 'sucursal_nombre', defaultContent: '' },
      { data: row => `
        <button type="button" name="btn_editar" class="btn btn-primary btn-sm" data-id="${row.id_deposito}">Editar</button>
        <button type="button" name="btn_eliminar" class="btn btn-danger btn-sm" data-id="${row.id_deposito}">Eliminar</button>
      `}
    ]
  });
};

const cargarSucursales = () => {
  fetch('/api/v1/sucursales')
    .then(resp => resp.json())
    .then(data => {
      if (data.success && data.data) {
        const select = document.getElementById('selectSucursal');
        select.innerHTML = '<option value="">Seleccione una sucursal</option>';
        data.data.forEach(sucursal => {
          const option = document.createElement('option');
          option.value = sucursal.id_sucursal;
          option.textContent = sucursal.descripcion;
          select.appendChild(option);
        });
      }
    }).catch(err => console.error("Error al cargar sucursales:", err));
};

// Validación de formulario
const validarFormulario = () => {
  const descripcion = $('#txtDescripcion').val().trim();
  const idSucursal = $('#selectSucursal').val();
  
  if (!descripcion) {
    Swal.fire("Error", "La descripción es obligatoria.", "error");
    return false;
  }

  // Solo letras, espacios y opcionalmente guiones
  const regexDesc = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s\-]+$/;
  if (!regexDesc.test(descripcion)) {
    Swal.fire("Error", "La descripción solo puede contener letras, espacios o guiones.", "error");
    return false;
  }

  if (!idSucursal) {
    Swal.fire("Error", "Debe seleccionar una sucursal.", "error");
    return false;
  }

  return true;
};

const guardar = () => {
  $('#btnGuardar').on('click', () => {
    if (!validarFormulario()) return;

    const idDeposito = $('#txtIdDeposito').val();
    const depositoData = {
      descripcion: $('#txtDescripcion').val().trim(),
      id_sucursal: $('#selectSucursal').val()
    };
    const tabla = $('#tbl').DataTable();

    const url = idDeposito ? `/api/v1/depositos/${idDeposito}` : `/api/v1/depositos`;
    const method = idDeposito ? 'PUT' : 'POST';

    fetch(url, {
      method,
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(depositoData)
    })
    .then(resp => resp.json())
    .then(data => {
      if (data.success) {
        tabla.ajax.reload();
        Swal.fire(idDeposito ? "Actualizado" : "Guardado", 
                  `Depósito ${idDeposito ? 'actualizado' : 'agregado'} correctamente.`, "success");
        $('#modalFormulario').modal("hide");
      } else {
        Swal.fire("Error", data.error || "Ocurrió un error desconocido", "error");
      }
    })
    .catch(() => Swal.fire("Error", "Ocurrió un error de comunicación con el servidor.", "error"));
  });
};

const editar = () => {
  $('#tbl').on('click', 'button[name="btn_editar"]', function(){
    const idDeposito = $(this).data('id');
    cargarSucursales();
    fetch(`/api/v1/depositos/${idDeposito}`)
      .then(resp => resp.json())
      .then(data => {
        if (data.success && data.data) {
          $('#txtIdDeposito').val(data.data.id_deposito);
          $('#txtDescripcion').val(data.data.descripcion);
          $('#selectSucursal').val(data.data.id_sucursal);
          $('#modalTitle').text("Editar un Depósito");
          $('#modalFormulario').modal("show");
        } else {
          Swal.fire("Error", "No se pudo cargar el depósito.", "error");
        }
      });
  });
};

const eliminar = () => {
  $('#tbl').on('click', 'button[name="btn_eliminar"]', function(){
    const idDeposito = $(this).data('id');
    Swal.fire({
      title: "¿Deseas eliminar este registro?",
      showCancelButton: true,
      confirmButtonText: "Sí",
      cancelButtonText: "No"
    }).then(result => {
      if (result.isConfirmed) {
        fetch(`/api/v1/depositos/${idDeposito}`, { method: 'DELETE' })
          .then(resp => resp.json())
          .then(data => {
            if (data.success) {
              $('#tbl').DataTable().ajax.reload();
              Swal.fire("Eliminado", "Depósito eliminado correctamente.", "success");
            } else {
              Swal.fire("Error", data.error || "Error desconocido");
            }
          })
          .catch(() => Swal.fire("Error", "Ocurrió un error al eliminar el depósito.", "error"));
      }
    });
  });
};

$(document).ready(() => {
  initDatatable();
  $('#btnAgregar').on('click', () => {
    cargarSucursales();
    $('#modalTitle').text("Agregar un Depósito");
    $('#txtIdDeposito').val("");
    $('#txtDescripcion').val("");
    $('#selectSucursal').val("");
    $('#modalFormulario').modal("show");
  });
  guardar();
  editar();
  eliminar();
});
</script>
{% endblock %}
